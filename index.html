<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Camino | Guía Espiritual</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-white shadow-sm py-4 px-6 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-amber-500 to-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md">✝</div>
            <div>
                <h1 class="font-bold text-lg leading-tight text-slate-900">EL CAMINO</h1>
                <p class="text-[10px] text-slate-500 uppercase tracking-widest">Guía 2026</p>
            </div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-28">
        
        <!-- 1. VISTA INICIO -->
        <div id="view-inicio" class="space-y-6">
            <div class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white p-6 rounded-2xl shadow-lg">
                <h2 class="text-2xl font-bold mb-2">Hola, damos un paso juntos</h2>
                <p class="text-blue-200 text-sm">"Lámpara es a mis pies tu lumbrera, y lumbrera a mi camino."</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-900 mb-4 text-lg">🕊️ ¿Cómo está tu corazón hoy?</h3>
                <div class="grid grid-cols-2 gap-2" id="grid-estados">
                    <button onclick="seleccionarEstado('ansioso')" class="p-3 text-sm bg-slate-50 border border-slate-200 rounded-xl text-left hover:border-blue-300 transition">😰 Ansioso</button>
                    <button onclick="seleccionarEstado('triste')" class="p-3 text-sm bg-slate-50 border border-slate-200 rounded-xl text-left hover:border-blue-300 transition">🌧️ Triste</button>
                    <button onclick="seleccionarEstado('economico')" class="p-3 text-sm bg-slate-50 border border-slate-200 rounded-xl text-left hover:border-blue-300 transition">📉 Preocupado</button>
                    <button onclick="seleccionarEstado('solo')" class="p-3 text-sm bg-slate-50 border border-slate-200 rounded-xl text-left hover:border-blue-300 transition">👤 Solo</button>
                    <button onclick="seleccionarEstado('bendecido')" class="p-3 text-sm bg-emerald-50 border border-emerald-200 rounded-xl text-left text-emerald-800 font-medium">✨ Bendecido</button>
                    <button onclick="seleccionarEstado('contento')" class="p-3 text-sm bg-emerald-50 border border-emerald-200 rounded-xl text-left text-emerald-800 font-medium">😊 Contento</button>
                    <button onclick="seleccionarEstado('agradecido')" class="p-3 text-sm bg-emerald-50 border border-emerald-200 rounded-xl text-left text-emerald-800 font-medium">🙏 Agradecido</button>
                    <button onclick="seleccionarEstado('motivado')" class="p-3 text-sm bg-emerald-50 border border-emerald-200 rounded-xl text-left text-emerald-800 font-medium">🚀 Motivado</button>
                </div>
                <div id="resultado-animo" class="hidden bg-amber-50 border border-amber-200 p-4 rounded-xl mt-4"></div>
            </div>
        </div>

        <!-- 2. VISTA CHAT IA -->
        <div id="view-chat" class="hidden flex flex-col h-[70vh]">
            <div id="chat-messages" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-3">
                <div class="flex items-start gap-2">
                    <div class="w-8 h-8 rounded-full bg-blue-900 text-white flex items-center justify-center text-xs font-bold shrink-0">✝</div>
                    <div class="bg-white border p-4 rounded-2xl rounded-tl-none text-sm shadow-sm">
                        <p>Hola, estoy aquí para escucharte. ¿Cómo te sientes hoy?</p>
                    </div>
                </div>
            </div>
            <div class="flex gap-2 bg-white p-2 rounded-2xl border shadow-sm">
                <input type="text" id="chat-input" placeholder="Escribe tu mensaje..." class="flex-1 px-3 py-2 text-sm focus:outline-none">
                <button onclick="enviarMensaje()" class="bg-blue-900 text-white px-4 py-2 rounded-xl text-sm font-bold">Enviar</button>
            </div>
        </div>

        <!-- 3. VISTA BIBLIA -->
        <div id="view-biblia" class="hidden flex flex-col items-center w-full max-w-lg mx-auto p-4 space-y-4">
            <h2 class="text-xl font-bold text-slate-900">Santa Biblia</h2>
            
            <div class="grid grid-cols-2 gap-2 w-full">
                <!-- Selector de Libro -->
                <select id="biblia-libro" onchange="actualizarCapitulos()" class="p-3 border rounded-xl text-sm bg-white shadow-sm">
                    <!-- Antiguo Testamento -->
                    <optgroup label="Antiguo Testamento">
                        <option value="Genesis">Génesis</option>
                        <option value="Exodo">Éxodo</option>
                        <option value="Levitico">Levítico</option>
                        <option value="Numeros">Números</option>
                        <option value="Deuteronomio">Deuteronomio</option>
                        <option value="Josue">Josué</option>
                        <option value="Jueces">Jueces</option>
                        <option value="Rut">Rut</option>
                        <option value="1 Samuel">1 Samuel</option>
                        <option value="2 Samuel">2 Samuel</option>
                        <option value="1 Reyes">1 Reyes</option>
                        <option value="2 Reyes">2 Reyes</option>
                        <option value="1 Cronicas">1 Crónicas</option>
                        <option value="2 Cronicas">2 Crónicas</option>
                        <option value="Esdras">Esdras</option>
                        <option value="Nehemias">Nehemías</option>
                        <option value="Ester">Ester</option>
                        <option value="Job">Job</option>
                        <option value="Salmos">Salmos</option>
                        <option value="Proverbios">Proverbios</option>
                        <option value="Eclesiastes">Eclesiastés</option>
                        <option value="Cantar de los Cantares">Cantares</option>
                        <option value="Isaias">Isaías</option>
                        <option value="Jeremias">Jeremías</option>
                        <option value="Lamentaciones">Lamentaciones</option>
                        <option value="Ezequiel">Ezequiel</option>
                        <option value="Daniel">Daniel</option>
                        <option value="Oseas">Oseas</option>
                        <option value="Joel">Joel</option>
                        <option value="Amos">Amós</option>
                        <option value="Abdias">Abdías</option>
                        <option value="Jonas">Jonás</option>
                        <option value="Miqueas">Miqueas</option>
                        <option value="Nahum">Nahum</option>
                        <option value="Habacuc">Habacuc</option>
                        <option value="Sofonias">Sofonías</option>
                        <option value="Hageo">Hageo</option>
                        <option value="Zacarias">Zacarías</option>
                        <option value="Malaquias">Malaquías</option>
                    </optgroup>
                    <!-- Nuevo Testamento -->
                    <optgroup label="Nuevo Testamento">
                        <option value="Mateo">Mateo</option>
                        <option value="Marcos">Marcos</option>
                        <option value="Lucas">Lucas</option>
                        <option value="Juan">Juan</option>
                        <option value="Hechos">Hechos</option>
                        <option value="Romanos">Romanos</option>
                        <option value="1 Corintios">1 Corintios</option>
                        <option value="2 Corintios">2 Corintios</option>
                        <option value="Galatas">Gálatas</option>
                        <option value="Efesios">Efesios</option>
                        <option value="Filipenses">Filipenses</option>
                        <option value="Colosenses">Colosenses</option>
                        <option value="1 Tesalonicenses">1 Tesalonicenses</option>
                        <option value="2 Tesalonicenses">2 Tesalonicenses</option>
                        <option value="1 Timoteo">1 Timoteo</option>
                        <option value="2 Timoteo">2 Timoteo</option>
                        <option value="Tito">Tito</option>
                        <option value="Filemon">Filemón</option>
                        <option value="Hebreos">Hebreos</option>
                        <option value="Santiago">Santiago</option>
                        <option value="1 Pedro">1 Pedro</option>
                        <option value="2 Pedro">2 Pedro</option>
                        <option value="1 Juan">1 Juan</option>
                        <option value="2 Juan">2 Juan</option>
                        <option value="3 Juan">3 Juan</option>
                        <option value="Judas">Judas</option>
                        <option value="Apocalipsis">Apocalipsis</option>
                    </optgroup>
                </select>

                <!-- Selector Automático de Capítulos -->
                <select id="biblia-cap" class="p-3 border rounded-xl text-sm bg-white shadow-sm">
                    <option value="1">Capítulo 1</option>
                </select>
            </div>

            <button onclick="cargarBibliaCompleta()" class="w-full bg-blue-900 text-white p-3 rounded-xl font-bold shadow-md hover:bg-blue-800 transition">Leer Capítulo</button>

            <div id="biblia-resultado" class="bg-white p-6 rounded-2xl border shadow-sm w-full min-h-[300px] max-h-[50vh] text-slate-700 leading-relaxed overflow-y-auto">
                <p class="text-slate-400 text-center mt-10">Selecciona libro y capítulo para leer.</p>
            </div>
        </div>

        <!-- 4. VISTAS EMPLEO Y APOYAR -->
        <div id="view-empleo" class="hidden text-center py-10"><h2 class="text-xl font-bold">💼 Empleo</h2></div>
        <div id="view-apoyar" class="hidden text-center py-10"><h2 class="text-xl font-bold">❤️ Apoyar</h2></div>
    </main>

    <!-- MENÚ INFERIOR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t py-3 shadow-lg z-50">
        <div class="flex justify-around items-center max-w-md mx-auto">
            <button onclick="cambiarVista('inicio', this)" class="nav-btn flex flex-col items-center text-blue-600">🏠<span class="text-[10px] font-semibold">Inicio</span></button>
            <button onclick="cambiarVista('chat', this)" class="nav-btn flex flex-col items-center text-slate-400">💬<span class="text-[10px] font-semibold">Chat IA</span></button>
            <button onclick="cambiarVista('biblia', this)" class="nav-btn flex flex-col items-center text-slate-400">📖<span class="text-[10px] font-semibold">Biblia</span></button>
            <button onclick="cambiarVista('empleo', this)" class="nav-btn flex flex-col items-center text-slate-400">💼<span class="text-[10px] font-semibold">Empleo</span></button>
            <button onclick="cambiarVista('apoyar', this)" class="nav-btn flex flex-col items-center text-slate-400">❤️<span class="text-[10px] font-semibold">Apoyar</span></button>
        </div>
    </nav>

    <script>
        // Tabla con la cantidad de capítulos de cada libro de la Biblia
        const totalCapitulos = {
            "Genesis": 50, "Exodo": 40, "Levitico": 27, "Numeros": 36, "Deuteronomio": 34,
            "Josue": 24, "Jueces": 21, "Rut": 4, "1 Samuel": 31, "2 Samuel": 24,
            "1 Reyes": 22, "2 Reyes": 25, "1 Cronicas": 29, "2 Cronicas": 36, "Esdras": 10,
            "Nehemias": 13, "Ester": 10, "Job": 42, "Salmos": 150, "Proverbios": 31,
            "Eclesiastes": 12, "Cantar de los Cantares": 8, "Isaias": 66, "Jeremias": 52,
            "Lamentaciones": 5, "Ezequiel": 48, "Daniel": 12, "Oseas": 14, "Joel": 3,
            "Amos": 9, "Abdias": 1, "Jonas": 4, "Miqueas": 7, "Nahum": 3,
            "Habacuc": 3, "Sofonias": 3, "Hageo": 2, "Zacarias": 14, "Malaquias": 4,
            "Mateo": 28, "Marcos": 16, "Lucas": 24, "Juan": 21, "Hechos": 28,
            "Romanos": 16, "1 Corintios": 16, "2 Corintios": 13, "Galatas": 6, "Efesios": 6,
            "Filipenses": 4, "Colosenses": 4, "1 Tesalonicenses": 5, "2 Tesalonicenses": 3,
            "1 Timoteo": 6, "2 Timoteo": 4, "Tito": 3, "Filemon": 1, "Hebreos": 13,
            "Santiago": 5, "1 Pedro": 5, "2 Pedro": 3, "1 Juan": 5, "2 Juan": 1,
            "3 Juan": 1, "Judas": 1, "Apocalipsis": 22
        };

        function actualizarCapitulos() {
            const libroSelect = document.getElementById('biblia-libro');
            const capSelect = document.getElementById('biblia-cap');
            const cant = totalCapitulos[libroSelect.value] || 1;
            
            let options = '';
            for (let i = 1; i <= cant; i++) {
                options += `<option value="${i}">Capítulo ${i}</option>`;
            }
            capSelect.innerHTML = options;
        }

        // Inicializar los capítulos al cargar la página por defecto con Génesis
        window.onload = function() {
            actualizarCapitulos();
        };

        function cambiarVista(vista, el) {
            ['inicio', 'chat', 'biblia', 'empleo', 'apoyar'].forEach(v => document.getElementById('view-' + v).classList.add('hidden'));
            document.getElementById('view-' + vista).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-blue-600', 'text-slate-400'));
            el.classList.replace('text-slate-400', 'text-blue-600');
        }

        // Lógica de Estados
        function seleccionarEstado(e) {
            const estados = { ansioso: {v: 'Filipenses 4:6', m: 'No se inquieten por nada.'}, triste: {v: 'Salmos 34:18', m: 'Dios está cerca.' } };
            const c = document.getElementById('resultado-animo');
            c.classList.remove('hidden');
            c.innerHTML = `<span class="font-bold text-amber-800">${estados[e]?.v || 'Versículo'}</span><p>${estados[e]?.m || 'Dios te ama.'}</p>`;
        }

        // Lógica de Chat
        function enviarMensaje() {
            const input = document.getElementById('chat-input');
            if(!input.value.trim()) return;
            const chat = document.getElementById('chat-messages');
            chat.innerHTML += `<div class="bg-blue-900 text-white p-3 rounded-2xl rounded-tr-none self-end text-sm">${input.value}</div>`;
            input.value = '';
        }

        // Lógica de Biblia con todos los versículos del capítulo
        async function cargarBibliaCompleta() {
            const libro = document.getElementById('biblia-libro').value;
            const cap = document.getElementById('biblia-cap').value;
            const res = document.getElementById('biblia-resultado');
            
            res.innerHTML = "Buscando en las escrituras...";
            try {
                const response = await fetch(`https://bible-api.com/${libro}+${cap}?translation=rv1960`);
                const data = await response.json();
                
                if (data.error) {
                    res.innerHTML = "No se pudo cargar este capítulo. Intenta nuevamente.";
                } else {
                    res.innerHTML = `<h3 class="font-bold text-blue-900 mb-3 text-lg">${data.reference}</h3>
                                     <p class="text-sm italic leading-relaxed">${data.text}</p>`;
                }
            } catch (err) {
                res.innerHTML = "Error de conexión. Revisa tu internet.";
            }
        }
    </script>
</body>
</html>

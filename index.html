<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Camino - App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-white shadow-sm py-4 px-6 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-amber-500 to-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md">✝</div>
            <h1 class="font-bold text-lg text-slate-900">EL CAMINO</h1>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-28">
        
        <!-- VISTA: INICIO (Tu código anterior) -->
        <div id="view-inicio" class="space-y-6">
            <div class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white p-6 rounded-2xl shadow-lg">
                <h2 class="text-2xl font-bold mb-2">Hola, damos un paso juntos</h2>
            </div>
            <!-- ... resto de tu contenido de inicio ... -->
        </div>

        <!-- VISTA: CHAT (Tu código anterior) -->
        <div id="view-chat" class="hidden">...</div>

        <!-- VISTA: BIBLIA (Profesional y Funcional) -->
        <div id="view-biblia" class="hidden space-y-4">
            <h2 class="text-xl font-bold text-slate-900 mb-2">Santa Biblia</h2>
            <div class="flex gap-2">
                <input type="text" id="biblia-ref" placeholder="Ej: Juan 3:16" class="flex-1 p-3 border rounded-xl text-sm shadow-sm outline-none">
                <button onclick="buscarBiblia()" class="bg-blue-900 text-white px-4 py-2 rounded-xl text-sm font-bold">Buscar</button>
            </div>
            <div id="biblia-resultado" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 min-h-[300px] whitespace-pre-line leading-relaxed">
                <p class="text-slate-400 text-center mt-10">Ingresa un libro, capítulo y versículo para comenzar tu lectura.</p>
            </div>
        </div>

        <!-- VISTAS: EMPLEO Y APOYAR -->
        <div id="view-empleo" class="hidden">...</div>
        <div id="view-apoyar" class="hidden">...</div>
    </main>

    <!-- MENÚ INFERIOR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t py-3 px-2 shadow-lg z-50">
        <div class="flex justify-around items-center max-w-md mx-auto">
            <button onclick="cambiarVista('inicio', this)" class="nav-btn flex flex-col items-center text-blue-600">🏠<span class="text-[10px]">Inicio</span></button>
            <button onclick="cambiarVista('chat', this)" class="nav-btn flex flex-col items-center text-slate-400">💬<span class="text-[10px]">Chat IA</span></button>
            <button onclick="cambiarVista('biblia', this)" class="nav-btn flex flex-col items-center text-slate-400">📖<span class="text-[10px]">Biblia</span></button>
            <button onclick="cambiarVista('empleo', this)" class="nav-btn flex flex-col items-center text-slate-400">💼<span class="text-[10px]">Empleo</span></button>
            <button onclick="cambiarVista('apoyar', this)" class="nav-btn flex flex-col items-center text-slate-400">❤️<span class="text-[10px]">Apoyar</span></button>
        </div>
    </nav>

    <script>
        // Lógica de navegación
        function cambiarVista(vista, el) {
            document.querySelectorAll('[id^="view-"]').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-' + vista).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-blue-600', 'text-slate-400'));
            el.classList.replace('text-slate-400', 'text-blue-600');
        }

        // Lógica de búsqueda bíblica profesional
        async function buscarBiblia() {
            const ref = document.getElementById('biblia-ref').value;
            const resDiv = document.getElementById('biblia-resultado');
            if (!ref) return;

            resDiv.innerHTML = "Buscando en las escrituras...";
            try {
                // Usamos una API gratuita de Biblia
                const response = await fetch(`https://bible-api.com/${ref}?translation=rv1960`);
                const data = await response.json();
                
                if (data.error) throw new Error("No encontrado");
                
                resDiv.innerHTML = `<h3 class="font-bold text-blue-900 mb-2">${data.reference}</h3><p class="text-slate-700 italic">"${data.text}"</p>`;
            } catch (err) {
                resDiv.innerHTML = `<p class="text-red-500 text-center">No encontramos ese pasaje. Verifica el nombre del libro (ej: Juan 3:16).</p>`;
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Camino - App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-white shadow-sm py-4 px-6 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-amber-500 to-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md">✝</div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-wide text-slate-900">EL CAMINO</h1>
                <p class="text-xs text-slate-500">2026 · Guía Espiritual</p>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-28" id="app-view">
        
        <!-- VISTA CHAT -->
        <div id="view-chat" class="flex flex-col h-[75vh]">
            <div class="bg-blue-50 border border-blue-100 p-3 rounded-xl mb-3 text-xs text-blue-900 flex items-center gap-2">
                <span>📅</span>
                <p>Estás en el año 2026. Jesús camina contigo hoy.</p>
            </div>

            <div id="chat-messages" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-3">
                <div class="flex items-start gap-2">
                    <div class="w-8 h-8 rounded-full bg-blue-900 text-white flex items-center justify-center text-xs font-bold shrink-0">✝</div>
                    <div class="bg-white border border-slate-200 p-4 rounded-2xl rounded-tl-none text-sm shadow-sm max-w-[90%]">
                        <p class="text-slate-800 leading-relaxed">La paz sea contigo en este 2026. El mundo ha cambiado, pero mi Palabra permanece firme. Cuéntame, ¿qué desafío enfrentas hoy en tu día a día? Estoy aquí para darte guía y consuelo.</p>
                        <span class="text-[10px] text-slate-400 mt-2 block italic">Jesús</span>
                    </div>
                </div>
            </div>

            <div class="flex gap-2 bg-white p-2 rounded-2xl border border-slate-200 shadow-sm">
                <input type="text" id="chat-input" placeholder="Ej: Me siento solo con tanta tecnología..." class="flex-1 px-3 py-2 text-sm focus:outline-none bg-transparent" onkeypress="if(event.key === 'Enter') enviarMensaje()">
                <button onclick="enviarMensaje()" class="bg-blue-900 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-blue-800 transition">Enviar</button>
            </div>
        </div>
    </main>

    <!-- MENÚ (Simplified for now) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-4 shadow-lg max-w-md mx-auto z-50">
        <div class="flex justify-around items-center text-blue-600">
            <span class="text-sm font-bold">Chat con Jesús</span>
        </div>
    </nav>

    <script>
        function enviarMensaje() {
            const input = document.getElementById('chat-input');
            const texto = input.value.trim();
            if (!texto) return;

            const contenedorChat = document.getElementById('chat-messages');

            // Usuario
            contenedorChat.innerHTML += `
                <div class="flex items-start justify-end gap-2">
                    <div class="bg-blue-900 text-white p-3 rounded-2xl rounded-tr-none text-sm shadow-sm max-w-[85%]">${texto}</div>
                </div>
            `;
            input.value = '';
            contenedorChat.scrollTop = contenedorChat.scrollHeight;

            // IA - Respuesta 2026 con Acción Bíblica
            setTimeout(() => {
                let respuesta = "Hijo, en medio del ruido digital de este tiempo, detente. Mi paz no es como la del mundo. ";
                let accion = "Acción sugerida: Apaga tu teléfono por 10 minutos, busca un lugar en silencio y lee Salmos 46:10.";

                const t = texto.toLowerCase();
                if (t.includes('ansiedad') || t.includes('estres') || t.includes('rapido')) {
                    respuesta = "Veo tu afán por la inmediatez del 2026. No dejes que las notificaciones controlen tu espíritu. ";
                    accion = "Acción sugerida: Haz una lista de lo que puedes controlar y entrégame lo que no, basándote en Filipenses 4:6-7. Ora al terminar.";
                } else if (t.includes('dinero') || t.includes('empleo') || t.includes('trabajo')) {
                    respuesta = "El sistema económico puede parecer incierto, pero yo soy tu Pastor y nada te faltará. ";
                    accion = "Acción sugerida: Dedica hoy 15 minutos a actualizar tu propósito profesional en lugar de solo tu CV. Lee Mateo 6:33.";
                } else if (t.includes('solo') || t.includes('soledad') || t.includes('redes')) {
                    respuesta = "Muchas conexiones, pero poca profundidad, ¿verdad? No busques validación en pantallas, mi amor es incondicional. ";
                    accion = "Acción sugerida: Llama hoy a un ser querido o a un hermano en la fe para hablar en persona. Busca Mateo 18:20.";
                }

                contenedorChat.innerHTML += `
                    <div class="flex items-start gap-2">
                        <div class="w-8 h-8 rounded-full bg-blue-900 text-white flex items-center justify-center text-xs font-bold shrink-0">✝</div>
                        <div class="bg-white border border-slate-200 p-4 rounded-2xl rounded-tl-none text-sm shadow-sm max-w-[90%]">
                            <p class="text-slate-800 leading-relaxed">${respuesta}</p>
                            <div class="mt-3 pt-3 border-t border-slate-100">
                                <p class="text-[11px] font-bold text-amber-700 uppercase">Acción para tu 2026:</p>
                                <p class="text-slate-600 italic mt-1 text-sm">${accion}</p>
                            </div>
                        </div>
                    </div>
                `;
                contenedorChat.scrollTop = contenedorChat.scrollHeight;
            }, 800);
        }
    </script>
</body>
</html>

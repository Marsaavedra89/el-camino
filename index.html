<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Camino | Acompañamiento Espiritual</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col">

    <!-- Header Profesional -->
    <header class="bg-white border-b border-slate-200 py-4 px-6">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-indigo-900 rounded-lg flex items-center justify-center text-white font-bold">✝</div>
                <div>
                    <h1 class="font-bold text-lg leading-none">EL CAMINO</h1>
                    <p class="text-[10px] text-slate-500 uppercase tracking-widest mt-1">Guía Espiritual 2026</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24">
        
        <!-- VISTA: INICIO -->
        <section id="view-inicio" class="space-y-6">
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="text-xl font-semibold mb-2">Bienvenido</h2>
                <p class="text-slate-600 text-sm italic">"Lámpara es a mis pies tu lumbrera, y lumbrera a mi camino."</p>
            </div>

            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <h3 class="font-medium text-slate-700 mb-4 uppercase text-xs tracking-wider">Estado Actual</h3>
                <div class="grid grid-cols-2 gap-3" id="estado-container">
                    <!-- Botones de estado -->
                    <button onclick="handleSelection('ansioso')" class="p-2 border border-slate-200 rounded text-sm hover:bg-slate-50 transition">Ansioso</button>
                    <button onclick="handleSelection('contento')" class="p-2 border border-slate-200 rounded text-sm hover:bg-slate-50 transition">Contento</button>
                    <!-- ... resto de botones -->
                </div>
                <div id="resultado-animo" class="hidden mt-4 p-4 bg-slate-50 border border-indigo-100 rounded-lg"></div>
            </div>
        </section>

        <!-- VISTA: CHAT -->
        <section id="view-chat" class="hidden flex flex-col h-[65vh]">
            <div id="chat-messages" class="flex-1 overflow-y-auto space-y-6 pr-2 mb-4">
                <div class="text-sm bg-white p-4 rounded-lg border border-slate-200">
                    <p class="text-slate-700">Bienvenido. ¿En qué puedo acompañarte hoy?</p>
                </div>
            </div>
            <div class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Escriba su mensaje..." class="flex-1 px-4 py-2 border border-slate-300 rounded focus:ring-1 focus:ring-indigo-900 outline-none text-sm">
                <button onclick="sendMessage()" class="px-6 py-2 bg-indigo-900 text-white rounded text-sm hover:bg-indigo-800 transition">Enviar</button>
            </div>
        </section>
    </main>

    <!-- Navegación -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-3">
        <div class="max-w-md mx-auto flex justify-around">
            <button onclick="switchView('inicio', this)" class="text-indigo-900 font-medium text-xs uppercase tracking-wider">Inicio</button>
            <button onclick="switchView('chat', this)" class="text-slate-400 font-medium text-xs uppercase tracking-wider">Chat IA</button>
        </div>
    </nav>

    <script>
        // Lógica simplificada y profesional
        function switchView(view, btn) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('view-' + view).classList.remove('hidden');
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;

            const chat = document.getElementById('chat-messages');
            chat.innerHTML += `<div class="text-sm bg-indigo-900 text-white p-4 rounded-lg self-end">${msg}</div>`;
            input.value = '';
            
            // Simulación de procesamiento
            setTimeout(() => {
                chat.innerHTML += `<div class="text-sm bg-white p-4 rounded-lg border border-slate-200"><p>Comprendo su punto. ¿Cómo le gustaría proceder al respecto?</p></div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Camino - App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-white shadow-sm py-4 px-6 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-amber-500 to-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md">✝</div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-wide text-slate-900">EL CAMINO</h1>
                <p class="text-xs text-slate-500">App Oficial</p>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24" id="app-content">
        <div class="space-y-6">
            <div class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white p-6 rounded-2xl shadow-lg">
                <h2 class="text-2xl font-bold mb-2">Hola, damos un paso juntos</h2>
                <p class="text-blue-200 text-sm">"Lámpara es a mis pies tu lumbrera, y lumbrera a mi camino."</p>
            </div>

            <!-- Módulo de Ánimo Limpio -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2 text-lg">
                    🕊️ ¿Cómo está tu corazón hoy?
                </h3>
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button onclick="seleccionarEstado('ansioso')" class="p-3 text-sm bg-slate-50 hover:bg-amber-50 border border-slate-200 rounded-xl transition">😰 Ansioso</button>
                    <button onclick="seleccionarEstado('economico')" class="p-3 text-sm bg-slate-50 hover:bg-amber-50 border border-slate-200 rounded-xl transition">📉 Preocupado por dinero</button>
                    <button onclick="seleccionarEstado('salud')" class="p-3 text-sm bg-slate-50 hover:bg-amber-50 border border-slate-200 rounded-xl transition">❤️ Problemas de salud</button>
                    <button onclick="seleccionarEstado('triste')" class="p-3 text-sm bg-slate-50 hover:bg-amber-50 border border-slate-200 rounded-xl transition">🌧️ Triste</button>
                    <button onclick="seleccionarEstado('enojado')" class="p-3 text-sm bg-slate-50 hover:bg-amber-50 border border-slate-200 rounded-xl transition">🔥 Enojado</button>
                    <button onclick="seleccionarEstado('solo')" class="p-3 text-sm bg-slate-50 hover:bg-amber-50 border border-slate-200 rounded-xl transition">👤 Me siento solo</button>
                </div>

                <div id="resultado-animo" class="hidden bg-amber-50/60 border border-amber-200/60 p-4 rounded-xl mt-3"></div>
            </div>
        </div>
    </main>

    <!-- MENÚ INFERIOR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-4 shadow-lg max-w-md mx-auto z-50">
        <div class="flex justify-around items-center">
            <button class="flex flex-col items-center text-blue-600"><span class="text-xl">🏠</span><span class="text-[10px] font-semibold mt-0.5">Inicio</span></button>
            <button class="flex flex-col items-center text-slate-400"><span class="text-xl">💬</span><span class="text-[10px] font-medium mt-0.5">Chat IA</span></button>
            <button class="flex flex-col items-center text-slate-400"><span class="text-xl">📖</span><span class="text-[10px] font-medium mt-0.5">Biblia</span></button>
            <button class="flex flex-col items-center text-slate-400"><span class="text-xl">💼</span><span class="text-[10px] font-medium mt-0.5">Empleo</span></button>
            <button class="flex flex-col items-center text-slate-400"><span class="text-xl">❤️</span><span class="text-[10px] font-medium mt-0.5">Apoyar</span></button>
        </div>
    </nav>

    <script>
        const mensajesBiblicos = {
            ansioso: [{ id: 'ans_1', versiculo: 'Filipenses 4:6-7', mensaje: 'No te afanes. Dios tiene el control, respira profundo y confía.' }],
            economico: [{ id: 'eco_1', versiculo: 'Mateo 6:33', mensaje: 'Busca primero el Reino y todo lo demás vendrá. Él proveerá.' }],
            salud: [{ id: 'sal_1', versiculo: 'Jeremías 30:17', mensaje: 'Él te devolverá la salud y sanará tus heridas. Ten fe.' }],
            triste: [{ id: 'tri_1', versiculo: 'Salmos 34:18', mensaje: 'El Señor está cerca de los que tienen el corazón quebrantado.' }],
            enojado: [{ id: 'eno_1', versiculo: 'Santiago 1:19-20', mensaje: 'Sé pronto para oír, tardo para hablar, tardo para airarte.' }],
            solo: [{ id: 'sol_1', versiculo: 'Josué 1:9', mensaje: 'No temas ni desmayes, porque el Señor estará contigo dondequiera que vayas.' }]
        };

        function seleccionarEstado(estado) {
            const seleccion = mensajesBiblicos[estado][0];
            const contenedor = document.getElementById('resultado-animo');
            contenedor.classList.remove('hidden');
            contenedor.innerHTML = `<span class="text-xs font-bold text-amber-800 uppercase">${seleccion.versiculo}</span><p class="text-sm mt-1">${seleccion.mensaje}</p>`;
        }
    </script>
</body>
</html>
